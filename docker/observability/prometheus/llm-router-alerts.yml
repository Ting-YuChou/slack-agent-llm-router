# Prometheus alerting rules for the chat analytics path
# (API producer -> Kafka -> ingestion consumer -> ClickHouse).
# Every metric referenced here is defined in src/utils/metrics.py;
# tests/test_alert_dedupe.py checks that.
groups:
  - name: llm-router-kafka-producer
    rules:
      - alert: LLMRouterKafkaProducerDroppingEvents
        expr: sum by (topic, reason) (increase(llm_router_kafka_producer_queue_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Analytics events dropped before Kafka ({{ $labels.topic }}, {{ $labels.reason }})"
          description: "The API's best-effort producer queue is dropping events; chat still works but analytics has gaps."
      - alert: LLMRouterKafkaProducerDeliveryFailing
        expr: sum by (topic) (increase(llm_router_kafka_producer_delivery_failed_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka deliveries exhausting retries ({{ $labels.topic }})"
          description: "Accepted analytics events failed delivery after all retries."
      - alert: LLMRouterKafkaProducerErrors
        expr: increase(llm_router_kafka_producer_errors_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka producer errors are elevated"
          description: "More than 10 producer errors in 10 minutes."
      - alert: LLMRouterKafkaProducerQueueBacklog
        expr: max(llm_router_kafka_producer_queue_depth) > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka producer delivery queue is backing up"
          description: "The in-process delivery queue has held more than 5000 events for 5 minutes."

  - name: llm-router-kafka-consumer
    rules:
      - alert: LLMRouterKafkaDeadLetters
        expr: sum by (topic) (increase(llm_router_kafka_dead_letter_messages_total[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Messages sent to the dead-letter topic ({{ $labels.topic }})"
          description: "The ingestion consumer could not persist some messages and dead-lettered them."
      - alert: LLMRouterKafkaConsumerLagHigh
        # Sink consumers only: observer consumers (topic_key "requests_enriched"
        # or "<key>_observer") read the same topics and start at latest.
        expr: sum by (topic, topic_key) (llm_router_kafka_consumer_lag{topic_key!~"requests_enriched|.+_observer"}) > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high ({{ $labels.topic }}, {{ $labels.topic_key }})"
          description: "Ingestion is more than 10000 messages behind for 10 minutes."
      - alert: LLMRouterKafkaConsumerStalled
        # Both gauges carry topic_key, the consumer key: "<key>" for a sink
        # consumer, "<key>_observer" for an observer, and the bare
        # "requests_enriched" for its observer-only consumer. All of them are
        # covered. Lag is recorded at each consumed message and refreshed from
        # the broker every lag_refresh_interval_seconds, so a consumer that
        # stops while records arrive shows lag > 0 and an ageing timestamp.
        expr: |
          (max by (topic_key) (llm_router_kafka_consumer_lag) > 0)
          and on (topic_key)
          (time() - max by (topic_key) (llm_router_kafka_last_consumed_timestamp_seconds) > 300)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer stalled ({{ $labels.topic_key }})"
          description: "The consumer is behind its topic but has consumed nothing for over 5 minutes."
      - alert: LLMRouterKafkaConsumerPartitionsPaused
        expr: sum by (topic) (llm_router_kafka_consumer_paused_partitions) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka partitions paused by ClickHouse backpressure ({{ $labels.topic }})"
          description: "Partitions have stayed paused for 10 minutes; ClickHouse writes are not keeping up."
      - alert: LLMRouterKafkaConsumerRestarting
        expr: sum by (topic) (increase(llm_router_kafka_consumer_restarts_total[15m])) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer restarting repeatedly ({{ $labels.topic }})"
          description: "More than 3 consumer task restarts in 15 minutes."

  - name: llm-router-clickhouse
    rules:
      - alert: LLMRouterClickHouseInsertErrors
        expr: increase(llm_router_clickhouse_insertion_errors_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse inserts failing"
          description: "Analytics rows are failing to insert into ClickHouse."
