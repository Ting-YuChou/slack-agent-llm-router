_metadata:
  major_version: 1

display_information:
  name: LLM Router Demo
  description: Single-model Slack demo for the LLM Router project
  background_color: "#1f2937"

features:
  bot_user:
    display_name: LLM Router Demo
    always_online: false
  slash_commands:
    - command: /llm
      description: Ask the single-model LLM Router demo
      usage_hint: help | agent <task|status|stop|close> | your question
      should_escape: false
  shortcuts:
    - name: Run Pi Agent
      type: message
      callback_id: run_pi_agent_from_thread
      description: Start a Pi coding agent with this Slack thread as context

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - files:read
      - lists:read

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
