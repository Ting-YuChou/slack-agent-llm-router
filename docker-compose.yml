# Every port is published on 127.0.0.1 only. Set CLICKHOUSE_PASSWORD,
# LLM_ROUTER_API_KEYS and REDIS_PASSWORD (for example in .env) before running.
x-router-app: &router-app
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment:
    LLM_ROUTER_CONFIG: config/config.compose.yaml
    LLM_ROUTER_API_KEYS: ${LLM_ROUTER_API_KEYS:?Set at least one API key for /route}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    LLM_ROUTER_WEB_SEARCH_ENABLED: ${LLM_ROUTER_WEB_SEARCH_ENABLED:-false}
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a Redis password}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set a private ClickHouse writer password}
  volumes:
    - ./logs:/app/logs
    - ./data:/app/data
    - ./config:/app/config:ro
  restart: unless-stopped

services:
  redis:
    image: redis:7.4-alpine
    container_name: slack-llm-router-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set a Redis password}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a Redis password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12

  redis-stack:
    image: redis/redis-stack-server:latest
    container_name: slack-llm-router-redis-stack
    ports:
      - "127.0.0.1:6380:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a Redis password}
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:?Set a Redis password}"
    volumes:
      - redis_stack_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.8.7
    container_name: slack-llm-router-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Topics come from the chat-topics service, with explicit retention.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 20"]
      interval: 10s
      timeout: 10s
      retries: 12

  # One-shot: creates every kafka.topics entry and its DLQ from the config.
  chat-topics:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: slack-llm-router-chat-topics
    command: ["python", "-m", "src.kafka_topics", "--config", "config/config.compose.yaml"]
    volumes:
      - ./config:/app/config:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: slack-llm-router-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: llm_router
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set a private ClickHouse writer password}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", 'clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"']
      interval: 10s
      timeout: 10s
      retries: 12

  api:
    <<: *router-app
    container_name: slack-llm-router-api
    command: ["python", "main.py", "start-api", "--config", "config/config.compose.yaml"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      chat-topics:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12

  workers:
    <<: *router-app
    container_name: slack-llm-router-workers
    command: ["python", "main.py", "start-workers", "--config", "config/config.compose.yaml"]
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      chat-topics:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

  rag-workers:
    <<: *router-app
    container_name: slack-llm-router-rag-workers
    profiles: ["rag"]
    command: ["python", "main.py", "start-rag-workers", "--config", "config/config.compose.yaml"]
    depends_on:
      redis-stack:
        condition: service_healthy

  flink-jobmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: slack-llm-router-flink-jobmanager
    command: jobmanager
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      PYTHONPATH: /workspace
    volumes:
      - ./flink:/workspace/flink:ro
      - ./src:/workspace/src:ro
    depends_on:
      kafka:
        condition: service_healthy
      chat-topics:
        condition: service_completed_successfully

  flink-taskmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: slack-llm-router-flink-taskmanager
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      PYTHONPATH: /workspace
    volumes:
      - ./flink:/workspace/flink:ro
      - ./src:/workspace/src:ro
    depends_on:
      flink-jobmanager:
        condition: service_started

volumes:
  redis_data:
  redis_stack_data:
  clickhouse_data:
  kafka_data:
