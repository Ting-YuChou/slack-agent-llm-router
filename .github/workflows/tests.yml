name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Check formatting
        run: python -m black --check src tests slack

      - name: Run flake8
        run: python -m flake8 src tests slack

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run mypy
        run: python -m mypy

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run pytest with agent coverage report
        run: python -m pytest tests -q --cov=src.agent_runtime --cov=src.agent_analytics --cov-report=term-missing

      # Floor is 2 points below the measured coverage of src/agent_*; raise it as coverage grows.
      - name: Enforce agent coverage threshold
        run: python -m coverage report --fail-under=77

      - name: Compile source tree
        run: python -m compileall src tests slack

  agent-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: agent-runtime
      # lint needs the compiled dist/ that extensions import, so it runs after the build in npm test.
      - run: npm run typecheck && npm test && npm run lint
        working-directory: agent-runtime
      # Reports line/branch/function coverage and fails below the floors set in package.json.
      - name: Coverage report and threshold
        run: npm run test:coverage
        working-directory: agent-runtime
