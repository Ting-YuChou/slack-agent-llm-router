name: Agent runtime Docker

# The harness paths only real containers exercise: the baseline-test restore in the verifier, real Pi running the
# policy extension, the run_checks dialog round trip, and the full loop through delivery and commit.
on:
  push:
    branches: [main]
    paths:
      - "agent-runtime/**"
      - "config/verification/**"
      - ".github/workflows/agent-docker.yml"
  pull_request:
    paths:
      - "agent-runtime/**"
      - "config/verification/**"
      - ".github/workflows/agent-docker.yml"
  workflow_dispatch:

concurrency:
  group: agent-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-runtime-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PI_AGENT_DOCKER_INTEGRATION: "1"
      PI_AGENT_TEST_AGENT_IMAGE: slack-pi-agent:ci
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - run: npm ci --ignore-scripts && npm run build
        working-directory: agent-runtime
      - uses: docker/setup-buildx-action@v3
      - name: Build agent image (agent-runtime/Dockerfile.agent)
        uses: docker/build-push-action@v6
        with:
          context: agent-runtime
          file: agent-runtime/Dockerfile.agent
          tags: slack-pi-agent:ci
          load: true
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max
      - name: Build gateway image (agent-runtime/Dockerfile.gateway)
        uses: docker/build-push-action@v6
        with:
          context: agent-runtime
          file: agent-runtime/Dockerfile.gateway
          tags: slack-pi-model-gateway:ci
          load: true
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
      - name: Build verification image (agent-runtime/Dockerfile.verification)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-runtime/Dockerfile.verification
          tags: slack-pi-verification:ci
          load: true
          cache-from: type=gha,scope=verification
          cache-to: type=gha,scope=verification,mode=max
      - name: Pull the fake gateway base image
        run: docker pull node:22.22.0-bookworm-slim
      - name: Run Docker suites
        working-directory: agent-runtime
        run: |
          # The verifier accepts only image digests, never tags.
          export PI_AGENT_VERIFICATION_TEST_IMAGE="$(docker image inspect --format '{{.Id}}' slack-pi-verification:ci)"
          node --test --test-concurrency=1 --test-reporter=spec \
            dist/test/docker-integration.test.js \
            dist/test/run-checks-rpc.test.js \
            dist/test/verification-docker.test.js \
            dist/test/full-loop-docker.test.js | tee docker-tests.log
          # A missing gate or image would skip silently; this job exists to run them.
          grep -q "^ℹ skipped 0$" docker-tests.log || { echo "Docker suites were skipped" >&2; exit 1; }
