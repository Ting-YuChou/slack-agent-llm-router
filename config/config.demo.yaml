api:
  rate_limiting:
    enabled: false

logging:
  level: INFO
  file: logs/slack_demo.log

agent:
  enabled: true
  base_url: http://127.0.0.1:3001
  token_env: AGENT_RUNTIME_TOKEN
  feedback_enabled: true
  connect_timeout_seconds: 2
  request_timeout_seconds: 910
  control_timeout_seconds: 10

router:
  default_model: gpt-5
  routing_strategy: intelligent
  fast_lane_models:
    - gpt-5
  scoring:
    local_simple_task_bonus: 0
  models:
    gpt-5:
      provider: openai
      api_key_env: OPENAI_API_KEY
      max_tokens: 128000
      context_window: 128000
      cost_per_token: 3.0e-05
      # List prices, USD per 1M tokens (X8). Source:
      # https://developers.openai.com/api/docs/pricing (standard tier, gpt-5),
      # checked 2026-10-29. OpenAI lists no cache-write price.
      pricing:
        input: 1.25
        cached_input: 0.125
        output: 10.0
      priority: 1
      allowed_tiers:
        - free
        - premium
        - enterprise
      reasoning_effort: minimal
      reasoning_effort_high: high
      reasoning_output_headroom_tokens: 4096
      capabilities:
        - general
        - reasoning
        - coding
        - analysis
        - writing
        - math
        - translation
        - tool_use
        - vision
  routing_rules: []

inference:
  openai:
    enabled: true
    base_url: https://api.openai.com/v1
    timeout: 60
    max_retries: 3
  anthropic:
    enabled: false
  vllm:
    enabled: false
  compression:
    enabled: false
  cache:
    enabled: false
    backend: memory
  single_flight:
    enabled: false
  scheduler:
    enabled: false
    queue_enabled: false

tools:
  web_search:
    enabled: false

rag:
  enabled: false

kafka:
  enabled: false

clickhouse:
  enabled: false

monitoring:
  enabled: false

slack:
  enabled: true
  bot_token_env: SLACK_BOT_TOKEN
  app_token_env: SLACK_APP_TOKEN
  signing_secret_env: SLACK_SIGNING_SECRET
  channels:
    - ai-testing
  work_queue:
    capacity: 32
    concurrency: 2
    overload_reply_timeout_seconds: 2
  response_settings:
    max_response_length: 3900
    typing_indicator: true
    answer_footer: true
    thread_replies: true
  rate_limiting:
    requests_per_hour: 100
    burst_requests: 5
  context:
    enabled: true
    strategy: thread_first
    max_thread_messages: 20
    max_channel_messages: 10
    max_context_chars: 4000
    include_bot_messages: false
    timeout_seconds: 3
    fail_open: true
  agent_context:
    enabled: true
    max_thread_messages: 20
    max_message_chars: 4000
    max_resources: 10
    max_resource_bytes: 262144
    max_resource_chars: 8000
    max_total_chars: 12000
    timeout_seconds: 10
    include_bot_messages: false
    fail_open: true
  attachments:
    enabled: true
    max_files: 10
    max_file_size_bytes: 10000000
    download_timeout_seconds: 30
  state_backend: file
  state_file: .pi-agent-runtime/slack_state.json
  memory:
    enabled: false
    backend: memory

streamlit:
  enabled: false

flink:
  enabled: false

policy_cache:
  enabled: false

security:
  # With API key auth off there is no principal: /route keeps the caller's
  # tier and priority. Enable it (see config.yaml) before exposing the API.
  api_keys:
    enabled: false
  cors:
    enabled: false

features:
  context_compression: false
  semantic_caching: false
  batch_processing: false
  multi_modal: false
  function_calling: false
  streaming_responses: false

pipeline:
  enabled: false
